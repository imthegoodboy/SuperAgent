name: Publish to npm

# Publishing a GitHub release (tag vX.Y.Z) publishes the same version to npm.
# Needs the repository secret NPM_TOKEN: an npm automation token allowed to publish @imthegoodboy/superagent.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance: the package page links back to this workflow run

concurrency:
  group: publish
  cancel-in-progress: false

env:
  # Tests and installs here must never touch the runner's agent folders or login items.
  SUPERAGENT_SKIP_INTEGRATIONS: '1'
  SUPERAGENT_SKIP_AUTOSTART: '1'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: The release tag matches package.json
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VERSION"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Add an npm automation token as the repository secret NPM_TOKEN"
            exit 1
          fi
          npm publish --access public --provenance
