name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `superagent doctor`
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: From ~/.superagent/logs/daemon.log or `superagent logs W<id>`. Remove anything private.
      render: text
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
