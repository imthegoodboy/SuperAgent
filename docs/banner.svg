<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="SuperAgent: turn the coding agent you already use into an always-on Super-agent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#14204a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6d7dff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6d7dff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="28" fill="url(#grid)"/>

  <!-- Words -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="84" y="150" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-1.5">SuperAgent</text>
    <text x="86" y="206" font-size="27" fill="#c9d3ff">Turn the coding agent you already use</text>
    <text x="86" y="242" font-size="27" fill="#c9d3ff">into an always-on Super-agent.</text>
    <text x="86" y="292" font-size="18" fill="#8d9bd0">Claude Code · Codex · OpenCode · Cursor, working in parallel</text>
  </g>
  <g font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace">
    <rect x="84" y="318" width="420" height="44" rx="10" fill="#0b1226" stroke="#2c3d78"/>
    <text x="104" y="347" font-size="18" fill="#7ee0a8">$</text>
    <text x="124" y="347" font-size="18" fill="#e6ebff">npm install -g @phigon/superagent</text>
  </g>

  <!-- Events flowing in -->
  <g font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace" font-size="14" fill="#8d9bd0">
    <text x="700" y="132">GitHub</text>
    <text x="700" y="206">CI</text>
    <text x="700" y="280">you</text>
  </g>
  <g stroke="#3b4f93" stroke-width="2" fill="none" stroke-dasharray="4 6">
    <path d="M758 128 C 806 128, 822 200, 868 200"/>
    <path d="M758 202 L 868 202"/>
    <path d="M758 276 C 806 276, 822 204, 868 204"/>
  </g>

  <!-- The router -->
  <circle cx="930" cy="202" r="110" fill="url(#glow)"/>
  <circle cx="930" cy="202" r="58" fill="url(#accent)"/>
  <circle cx="930" cy="202" r="58" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  <text x="930" y="198" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">your agent</text>
  <text x="930" y="220" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#e7e9ff">router</text>

  <!-- Workers -->
  <g stroke="#5b8cff" stroke-width="2" fill="none" stroke-opacity="0.8">
    <path d="M986 186 C 1030 150, 1040 88, 1078 88"/>
    <path d="M988 196 C 1030 180, 1040 160, 1078 160"/>
    <path d="M988 208 C 1030 222, 1040 232, 1078 232"/>
    <path d="M986 218 C 1030 254, 1040 304, 1078 304"/>
  </g>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="1078" y="68" width="140" height="40" rx="20" fill="#111a38" stroke="#5b8cff"/>
    <text x="1148" y="93" text-anchor="middle" fill="#e6ebff">Claude Code</text>
    <rect x="1078" y="140" width="140" height="40" rx="20" fill="#111a38" stroke="#5b8cff"/>
    <text x="1148" y="165" text-anchor="middle" fill="#e6ebff">Codex</text>
    <rect x="1078" y="212" width="140" height="40" rx="20" fill="#111a38" stroke="#5b8cff"/>
    <text x="1148" y="237" text-anchor="middle" fill="#e6ebff">OpenCode</text>
    <rect x="1078" y="284" width="140" height="40" rx="20" fill="#111a38" stroke="#5b8cff"/>
    <text x="1148" y="309" text-anchor="middle" fill="#e6ebff">Cursor</text>
  </g>
  <g fill="#7ee0a8">
    <circle cx="1206" cy="88" r="4"/>
    <circle cx="1206" cy="160" r="4"/>
    <circle cx="1206" cy="232" r="4"/>
    <circle cx="1206" cy="304" r="4"/>
  </g>
</svg>
